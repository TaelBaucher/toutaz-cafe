name: Build and Release Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build et Sauvegarde de l'APK
    runs-on: ubuntu-latest

    steps:
      # 1. Téléchargement du code
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Configuration de Java (Requis pour l'outil de build Android)
      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' # Java 21 est recommandé pour Gradle 9+

      # 3. Configuration de Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Récupère la dernière version stable de Flutter (>= 3.27 selon ton pubspec.yaml)
          cache: true

      # 4. Installation des dépendances Flutter
      - name: Install dependencies
        run: flutter pub get

      # 5. Compilation de l'APK Flutter
      - name: Build de l'APK
        run: flutter build apk --release

      # 6. Sauvegarde du fichier (Artifact)
      - name: Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          # Chemin généré par flutter build apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
